<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <!-- Background Radial Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFDF7"/>
      <stop offset="70%" stop-color="#FEF3C7"/>
      <stop offset="100%" stop-color="#FDE68A"/>
    </radialGradient>

    <!-- Banana Leaf Gradient -->
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#16A34A"/>
      <stop offset="50%" stop-color="#15803D"/>
      <stop offset="100%" stop-color="#166534"/>
    </linearGradient>

    <!-- Brass Thali Outer Rim Gradient -->
    <linearGradient id="brassOuter" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A"/>
      <stop offset="25%" stop-color="#D97706"/>
      <stop offset="50%" stop-color="#FBBF24"/>
      <stop offset="75%" stop-color="#B45309"/>
      <stop offset="100%" stop-color="#78350F"/>
    </linearGradient>

    <!-- Silver / Stainless Steel Banquet Plate Gradient -->
    <linearGradient id="steelInner" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="35%" stop-color="#F1F5F9"/>
      <stop offset="70%" stop-color="#CBD5E1"/>
      <stop offset="100%" stop-color="#94A3B8"/>
    </linearGradient>

    <!-- Delicious Curry / Dish Golden Gravy Gradient -->
    <radialGradient id="dishGrad" cx="45%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="30%" stop-color="#F59E0B"/>
      <stop offset="70%" stop-color="#D97706"/>
      <stop offset="100%" stop-color="#991B1B"/>
    </radialGradient>

    <!-- Cloche Cover Dome Gradient -->
    <linearGradient id="clocheGrad" x1="20%" y1="10%" x2="80%" y2="90%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.9"/>
      <stop offset="30%" stop-color="#FBBF24" stop-opacity="0.8"/>
      <stop offset="70%" stop-color="#D97706" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#78350F"/>
    </linearGradient>

    <!-- Subtle Drop Shadow -->
    <filter id="softShadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#78350F" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- Background Card Circle -->
  <rect width="256" height="256" rx="48" fill="url(#bgGrad)"/>
  <circle cx="128" cy="128" r="116" fill="none" stroke="#FDE68A" stroke-width="2" opacity="0.6"/>

  <!-- Plantain Banana Leaf Accent Base -->
  <g filter="url(#softShadow)">
    <path d="M 40 160 C 40 100, 110 50, 216 64 C 220 120, 170 200, 68 200 C 50 200, 40 180, 40 160 Z" fill="url(#leafGrad)"/>
    <!-- Leaf veins -->
    <path d="M 46 162 C 100 130, 160 100, 212 66" stroke="#86EFAC" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.7"/>
    <path d="M 85 140 C 95 125, 115 120, 128 122" stroke="#86EFAC" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.5"/>
    <path d="M 120 120 C 135 105, 155 102, 170 106" stroke="#86EFAC" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.5"/>
    <path d="M 155 100 C 170 85, 185 84, 198 88" stroke="#86EFAC" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.5"/>
  </g>

  <!-- Traditional Brass Thali Plate -->
  <g filter="url(#softShadow)">
    <!-- Outer Rim -->
    <circle cx="132" cy="136" r="82" fill="url(#brassOuter)"/>
    <circle cx="132" cy="136" r="76" fill="#FBBF24" opacity="0.3"/>
    <circle cx="132" cy="136" r="72" fill="url(#steelInner)"/>
    
    <!-- Inner Dish Gravy / Feast Portion -->
    <circle cx="132" cy="136" r="54" fill="url(#dishGrad)"/>
    
    <!-- Traditional Dish Texture / Basmati Rice & Ghee Drops -->
    <!-- Ghee shimmer pool -->
    <ellipse cx="124" cy="126" rx="28" ry="18" fill="#FEF08A" opacity="0.6"/>
    <!-- Garnish: Curry Leaves -->
    <path d="M 130 122 C 122 114, 126 106, 138 108 C 142 116, 138 124, 130 122 Z" fill="#15803D"/>
    <path d="M 131 122 L 136 109" stroke="#86EFAC" stroke-width="0.8" fill="none"/>
    <path d="M 138 126 C 146 122, 150 114, 146 106 C 138 110, 136 120, 138 126 Z" fill="#16A34A"/>
    <!-- Mustard seeds & spice garnish specks -->
    <circle cx="116" cy="132" r="2.2" fill="#451A03"/>
    <circle cx="146" cy="138" r="1.8" fill="#451A03"/>
    <circle cx="134" cy="146" r="2" fill="#78350F"/>
    <circle cx="120" cy="144" r="1.5" fill="#451A03"/>
    <circle cx="140" cy="120" r="1.5" fill="#DC2626"/>
    <circle cx="110" cy="124" r="2" fill="#B45309"/>
    <!-- Cashew Nut Garnish -->
    <path d="M 122 135 C 118 131, 118 125, 125 124 C 128 124, 129 127, 126 131 C 124 133, 125 137, 122 135 Z" fill="#FEF3C7" stroke="#D97706" stroke-width="0.8"/>
  </g>

  <!-- Culinary Aromatic Steam Plumes -->
  <g opacity="0.65" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" fill="none">
    <path d="M 116 88 C 112 78, 120 70, 115 60"/>
    <path d="M 134 82 C 130 68, 140 60, 135 48" stroke-width="3"/>
    <path d="M 152 86 C 148 76, 156 68, 152 58"/>
  </g>

  <!-- Chef Cloche Handle / Sparkle Ring Top -->
  <circle cx="134" cy="42" r="4.5" fill="#D97706" stroke="#FEF3C7" stroke-width="1.5"/>

  <!-- Authentic Pure Veg Green Dot Badge (Top-Left) -->
  <g transform="translate(24, 24)">
    <rect width="24" height="24" rx="5" fill="#FFFFFF" stroke="#16A34A" stroke-width="2"/>
    <circle cx="12" cy="12" r="5" fill="#16A34A"/>
  </g>
</svg>

